included:
  - Sources
  - Tests
excluded:
  - .build
# swift-format deliberately emits these layouts. Running two tools that fight
# over commas and line breaks makes both less useful.
disabled_rules:
  - closure_parameter_position
  - implicit_optional_initialization
  - opening_brace
  - trailing_comma
opt_in_rules:
  - array_init
  - async_without_await
  - attributes
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - discouraged_none_name
  - discarded_notification_center_observer
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicitly_unwrapped_optional
  - incompatible_concurrency_annotation
  - last_where
  - legacy_multiple
  - lower_acl_than_parent
  - modifier_order
  - number_separator
  - overridden_super_call
  - prefer_key_path
  - prefer_self_in_static_references
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_sendable
  - sorted_first_last
  - static_operator
  - test_case_accessibility
  - toggle_bool
  - unavailable_function
  - unhandled_throwing_task
  - unowned_variable_capture
  - unused_parameter
  - weak_delegate
  - yoda_condition
analyzer_rules:
  - unused_import
cyclomatic_complexity:
  warning: 15
  error: 30
file_length:
  warning: 700
  error: 800
function_body_length:
  warning: 80
  error: 150
identifier_name:
  min_length: 3
  excluded:
    - id
    - up
    - x
    - y
line_length:
  warning: 140
  error: 180
  ignores_comments: false
  ignores_urls: true
type_body_length:
  warning: 500
  error: 600
reporter: xcode
strict: true
allow_zero_lintable_files: false
