[tool.ruff]
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["line-too-long"]

[tool.ruff.format]
line-ending = "lf"
preview = true

[tool.ty.analysis]
# uharfbuzz re-exports a Cython extension without .pyi files. Keep only this
# native module opaque; font shaping is exercised by the native font checks.
replace-imports-with-any = ["uharfbuzz"]
# lxml.etree is also a compiled extension without shipped Python type stubs.
allowed-unresolved-imports = ["lxml.etree"]

[tool.ty.environment]
python-platform = "all"

[tool.ty.src]
include = ["**/*.py", "**/*.pyi"]
exclude = [".git", ".direnv", ".ruff_cache", "**/__pycache__", "result"]

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"
