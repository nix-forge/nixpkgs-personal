{
  "name": "Update packages",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "package": {
          "description": "Reserved updater input",
          "type": "string",
          "required": false
        }
      }
    }
  },
  "permissions": {},
  "jobs": {
    "probe": {
      "if": "github.ref == 'refs/heads/codex/pstack-api-diagnostic'",
      "runs-on": "macos-26",
      "timeout-minutes": 5,
      "permissions": {
        "actions": "write",
        "contents": "write",
        "pull-requests": "write"
      },
      "steps": [
        {
          "name": "Compare public commit access",
          "env": {
            "GITHUB_TOKEN": "${{ github.token }}"
          },
          "shell": "bash",
          "run": "python3 <<'PY'\nimport json, os, re\nfrom urllib.error import HTTPError\nfrom urllib.request import Request, urlopen\n\nallowed = set(\"access accessible account actions api application app authentication authorization authorized bad before blocked by can commit contents credentials disabled due enabled exceeded forbidden github has endpoint installation integration invalid ip is limit list minutes not oauth of only organization personal please policy rate repository request resource restrictions secondary suspended temporarily the this to token try unavailable using users verified wait with you your\".split())\nrequests = [(\"public-token\", \"cursor/plugins\", True), (\"public-anonymous\", \"cursor/plugins\", False), (\"control-public-token\", \"anthropics/skills\", True), (\"own-repository-token\", \"nix-forge/nixpkgs-personal\", True), (\"own-repository-anonymous\", \"nix-forge/nixpkgs-personal\", False)]\nfor label, repository, authenticated in requests:\n    headers = {\"Accept\": \"application/vnd.github+json\", \"User-Agent\": \"nix-conf-updater/1.0 (+https://github.com/NixOS/nixpkgs)\", \"X-GitHub-Api-Version\": \"2022-11-28\"}\n    if authenticated:\n        headers[\"Authorization\"] = \"Bearer \" + os.environ[\"GITHUB_TOKEN\"]\n    request = Request(\"https://api.github.com/repos/\" + repository + \"/commits/main\", headers=headers)\n    try:\n        response = urlopen(request, timeout=30)\n    except HTTPError as exc:\n        response = exc\n    with response:\n        body = response.read(16384)\n        result = {\"probe\": label, \"status\": response.status}\n        for name in (\"X-RateLimit-Remaining\", \"X-RateLimit-Reset\", \"Retry-After\"):\n            value = response.headers.get(name, \"\")\n            if value.isascii() and value.isdecimal():\n                result[name] = value\n        try:\n            payload = json.loads(body)\n        except (ValueError, UnicodeError):\n            result[\"json\"] = False\n        else:\n            result[\"json\"] = True\n            if isinstance(payload, dict) and isinstance(payload.get(\"message\"), str):\n                words = re.findall(\"[a-z]+\", payload[\"message\"].lower())[:120]\n                result[\"message_known_words\"] = [word if word in allowed else \"_\" for word in words]\n            if isinstance(payload, dict) and re.fullmatch(\"[0-9a-f]{40}\", str(payload.get(\"sha\", \"\"))):\n                result[\"revision\"] = payload[\"sha\"]\n        print(json.dumps(result, sort_keys=True))\nPY\n"
        },
        {
          "name": "Probe public Git metadata without credentials",
          "shell": "bash",
          "env": {
            "GIT_TERMINAL_PROMPT": "0",
            "GIT_ASKPASS": "/usr/bin/false",
            "SSH_ASKPASS": "/usr/bin/false"
          },
          "run": "set -euo pipefail\nprobe_root=$(mktemp -d)\ntrap 'rm -rf -- \"$probe_root\"' EXIT\ngit -C \"$probe_root\" init --quiet\nif git -C \"$probe_root\" -c credential.helper= -c http.extraHeader= fetch --quiet --depth=1 --filter=blob:none --no-tags https://github.com/cursor/plugins.git refs/heads/main >\"$probe_root/stdout\" 2>\"$probe_root/stderr\"; then\n  revision=$(git -C \"$probe_root\" rev-parse FETCH_HEAD)\n  [[ \"$revision\" =~ ^[0-9a-f]{40}$ ]]\n  authored=$(git -C \"$probe_root\" show --no-patch --format=%aI \"$revision\")\n  [[ \"$authored\" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]\n  printf 'public-git status=success revision=%s authored=%s\\n' \"$revision\" \"$authored\"\nelse\n  echo 'public-git status=failure'\n  exit 1\nfi\n"
        }
      ]
    }
  }
}
