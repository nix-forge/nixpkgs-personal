name: Dependency review
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base commit or ref to compare.
        required: true
        type: string
      head_ref:
        description: Head commit or ref to compare.
        required: true
        type: string
permissions: {}
jobs:
  dependency-review:
    name: dependency-review
    permissions:
      contents: read
      pull-requests: write # Update pull request metadata.
    uses: nix-forge/ci/.github/workflows/dependency-review.yml@03eb849e788bd71ac08afab6a1135a6ff6514f3c # v1.0.4
    with:
      base-ref: ${{ inputs.base_ref }}
      head-ref: ${{ inputs.head_ref }}
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')
    needs: [dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@03eb849e788bd71ac08afab6a1135a6ff6514f3c # v1.0.4
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
