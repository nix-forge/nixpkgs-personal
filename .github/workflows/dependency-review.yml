name: Dependency review
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base commit or ref to compare.
        required: true
        type: string
      head_ref:
        description: Head commit or ref to compare.
        required: true
        type: string
permissions: {}
jobs:
  source-start:
    # Deliver the source notification before validation; status writes are asynchronous.
    name: Source validation start callback
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/automation/package-updates-')
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Notify the protected default-branch reconciler.
    steps:
      - name: Notify source validation start
        uses: nix-forge/ci/actions/queue-completion@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          source-activity: in_progress
  dependency-review:
    needs: [source-start]
    if: "!cancelled()"
    name: dependency-review
    permissions:
      contents: read
      pull-requests: write # Update pull request metadata.
    uses: nix-forge/ci/.github/workflows/dependency-review.yml@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
    with:
      base-ref: ${{ inputs.base_ref }}
      head-ref: ${{ inputs.head_ref }}
  queue-completion:
    continue-on-error: ${{ !startsWith(github.ref, 'refs/heads/automation/package-updates-') }}
    name: Queue completion callback
    if: >-
      always() && github.event_name == 'workflow_dispatch' && (startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/',
      github.event.repository.default_branch)) || startsWith(github.ref, 'refs/heads/automation/package-updates-'))
    needs: [source-start, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          source-activity: ${{ startsWith(github.ref, 'refs/heads/automation/package-updates-') && 'completed'
            || '' }}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
