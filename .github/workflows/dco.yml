name: DCO
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '43 11 * * 0'
  workflow_dispatch:
    inputs:
      base_sha:
        description: Queue commit parent; omit to run the DCO fixture.
        type: string
        required: false
permissions: {}
concurrency:
  group: dco-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  sign-off:
    name: DCO sign-off
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # Verify owned package update PR metadata.
    steps:
      - name: Check out the merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every proposed commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ inputs.base_sha || github.event_name == 'pull_request' && github.event.pull_request.base.sha
            || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha
            }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          check_signoffs() {
            test -n "$BASE_SHA"
            test -n "$HEAD_SHA"
            git cat-file -e "${BASE_SHA}^{commit}"

            if ! git cat-file -e "${HEAD_SHA}^{commit}"; then
              if [ "$EVENT_NAME" = pull_request ] && [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
                git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
              fi
            fi
            git cat-file -e "${HEAD_SHA}^{commit}"

            local commit_range="${BASE_SHA}..${HEAD_SHA}"
            # GitHub's merge queue adds an unsigned synthetic tip commit. The
            # commits it contains were already checked on the pull request; skip
            # only that generated tip and continue checking every real commit.
            if [ "$EVENT_NAME" = merge_group ]; then
              commit_range="${BASE_SHA}..${HEAD_SHA}^"
            fi

            local missing=() commit author
            while IFS= read -r commit; do
              author=$(git show -s --format='%an <%ae>' "$commit")
              if git show -s --format='%B' "$commit" | grep -Fqx "Signed-off-by: $author"; then
                continue
              fi

              # Dependabot authors with its GitHub noreply identity but uses its
              # support address in the DCO trailer.
              if [ "$author" = 'dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>' ] &&
                git show -s --format='%B' "$commit" | grep -Fqx 'Signed-off-by: dependabot[bot] <support@github.com>'; then
                continue
              fi

              missing+=("$commit $author")
            done < <(git rev-list --no-merges "$commit_range")

            if [ "${#missing[@]}" -gt 0 ]; then
              printf '%s\n' 'Every commit must contain a valid Signed-off-by trailer for its author.'
              printf 'Missing sign-off: %s\n' "${missing[@]}"
              printf '%s\n' 'Use: git commit --signoff'
              return 1
            fi
          }

          check_queue_dispatch() {
            # A dispatched queue run validates the exact synthetic commit
            # built from the parent selected by the trusted reconciler.
            [[ "$GITHUB_REF" == refs/heads/gh-readonly-queue/"$DEFAULT_BRANCH"/* ]] || return 1
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || return 1
            test "$(git rev-parse "${HEAD_SHA}^")" = "$BASE_SHA" || return 1
            local original_event=$EVENT_NAME
            EVENT_NAME=merge_group
            check_signoffs
            EVENT_NAME=$original_event
          }

          check_source_dispatch() {
            [[ "$GITHUB_REF" == refs/heads/automation/package-updates-* ]] || return 1
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || return 1
            test "$(git rev-parse HEAD)" = "$HEAD_SHA" || return 1
            # A source update is one real commit, not a synthetic queue tip.
            test "$(git show -s --format=%P "$HEAD_SHA")" = "$BASE_SHA" || return 1
            git fetch --no-tags origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            git merge-base --is-ancestor "$BASE_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
            local branch=${GITHUB_REF#refs/heads/} package package_path path changed=false workflow
            package=${branch#automation/package-updates-}
            [[ "$package" =~ ^[a-z0-9][a-z0-9+._-]*$ ]] || return 1
            package_path="pkgs/by-name/${package:0:2}/$package"
            while IFS= read -r -d '' path; do
              if [[ "$path" == "$package_path/"* ]]; then
                changed=true
              elif [[ "$path" != docs/catalog.md ]]; then
                return 1
              fi
            done < <(git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA")
            [[ "$changed" == true ]] || return 1
            # Stale validation contracts require a source branch refresh, not
            # copying CI files into the focused package update.
            for workflow in ci.yml codeql.yml dependency-review.yml dco.yml fuzz.yml; do
              test "$(git rev-parse "${HEAD_SHA}:.github/workflows/$workflow")" = \
                "$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH:.github/workflows/$workflow")" || return 1
            done
            gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open -f head="${GITHUB_REPOSITORY%%/*}:$branch" -f base="$DEFAULT_BRANCH" -f per_page=100 | \
              jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$HEAD_SHA" \
                --arg branch "$branch" --arg base "$DEFAULT_BRANCH" '
                map(select(.head.repo.full_name == $repo and .head.ref == $branch and
                  .head.sha == $sha and .base.repo.full_name == $repo and .base.ref == $base)) |
                length == 1 and .[0].state == "open" and .[0].draft == false and
                .[0].user.id == 41898282 and .[0].user.type == "Bot" and
                .[0].user.login == "github-actions[bot]"
              ' >/dev/null
            check_signoffs
          }

          if [ "$EVENT_NAME" = workflow_dispatch ] && [ -n "$BASE_SHA" ]; then
            if [[ "$GITHUB_REF" == refs/heads/gh-readonly-queue/"$DEFAULT_BRANCH"/* ]]; then
              check_queue_dispatch
            else
              check_source_dispatch
            fi
          elif [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            fixture=$(mktemp -d)
            trap 'rm -rf "$fixture"' EXIT
            cd "$fixture"
            git init -q
            git config commit.gpgsign false
            git -c user.name=Fixture -c user.email=fixture@example.invalid commit --allow-empty -qm base
            BASE_SHA=$(git rev-parse HEAD)
            git -c user.name='dependabot[bot]' -c user.email='49699333+dependabot[bot]@users.noreply.github.com' \
              commit --allow-empty -qm $'bot update\n\nSigned-off-by: dependabot[bot] <support@github.com>'
            git -c user.name=Fixture -c user.email=fixture@example.invalid \
              commit --allow-empty -qm $'human update\n\nSigned-off-by: Fixture <fixture@example.invalid>'
            HEAD_SHA=$(git rev-parse HEAD)
            check_signoffs
            BASE_SHA=$HEAD_SHA
            git -c user.name=Fixture -c user.email=fixture@example.invalid \
              commit --allow-empty -qm 'unsigned synthetic queue tip'
            HEAD_SHA=$(git rev-parse HEAD)
            GITHUB_REF="refs/heads/gh-readonly-queue/$DEFAULT_BRANCH/fixture"
            check_queue_dispatch
            BASE_SHA=$(git rev-parse "${HEAD_SHA}^^")
            if check_queue_dispatch; then
              echo 'DCO queue fixture accepted a wrong parent' >&2
              exit 1
            fi
            BASE_SHA=$HEAD_SHA
            git -c user.name='dependabot[bot]' -c user.email='49699333+dependabot[bot]@users.noreply.github.com' \
              commit --allow-empty -qm $'bad trailer\n\nSigned-off-by: dependabot[bot] <wrong@example.invalid>'
            HEAD_SHA=$(git rev-parse HEAD)
            if check_signoffs; then
              echo 'DCO fixture accepted an invalid Dependabot trailer' >&2
              exit 1
            fi
            echo 'DCO fixture passed'
          else
            check_signoffs
          fi
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/',
      github.event.repository.default_branch))
    needs: [sign-off]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Notify the trusted default-branch reconciler.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@32dec0910e46dda3568ef5a494ed5fb6a9a08f31 # v2.10.0
