name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  flake-lock:
    name: Flake lock (${{ matrix.lockfile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lockfile: [flake.lock, flake/dev/flake.lock]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # v13
        with:
          fail-mode: true
          flake-lock-path: ${{ matrix.lockfile }}
  lint:
    name: Lint and security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Materialize partition source
        run: nix store add-path flake/dev
      - run: nix develop --command prek run --all-files
      - run: nix develop --command gitleaks detect --source . --redact --config=.gitleaks.toml
  flake:
    name: Flake checks (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Materialize partition source
        run: nix store add-path flake/dev
      - run: nix flake check --keep-going --show-trace --print-build-logs --no-build --system "${{ matrix.system }}"
  build:
    name: Build (${{ matrix.system }})
    needs: [lint, flake]
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Build affected packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          SYSTEM: ${{ matrix.system }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            changed_files=$(git ls-files)
          else
            changed_files=$(git diff --name-only "$BASE_SHA" HEAD)
          fi

          all_packages=$(nix eval --json ".#packages.$SYSTEM" --apply builtins.attrNames | jq -r '.[]')
          if grep -qE '^(flake\.nix|flake\.lock|pkgs/default\.nix)$' <<<"$changed_files"; then
            targets="$all_packages"
          elif grep -q '^pkgs/by-name/' <<<"$changed_files"; then
            targets=$(sed -nE 's#^pkgs/by-name/[^/]+/([^/]+)/.*#\1#p' <<<"$changed_files" | sort -u)
            targets=$(comm -12 <(sort <<<"$targets") <(sort <<<"$all_packages"))
          else
            targets=""
          fi

          if [[ -z "$targets" ]]; then
            echo "No packages for $SYSTEM were affected."
            exit 0
          fi

          while IFS= read -r package; do
            [[ -n "$package" ]] || continue
            nix build ".#$package" --keep-going --show-trace --print-build-logs
            if [[ "$package" == openai-codex-desktop ]]; then
              nix build --no-link --keep-going --show-trace --print-build-logs \
                ".#checks.$SYSTEM.openai-codex-desktop-updater" \
                ".#checks.$SYSTEM.openai-codex-desktop-package-contract"
            fi
          done <<<"$targets"
  swift-quality:
    name: Swift quality (macOS 26)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Materialize partition source
        run: nix store add-path flake/dev
      - name: Compiler, lint, test, and dead-code checks
        env:
          OCR_CAPTURE_RUN_SANITIZERS: "0"
        run: nix develop --command pkgs/by-name/oc/ocr-capture/Scripts/check-quality.sh
      - name: Xcode Swift 6 formatter compatibility
        run: >-
          xcrun swift-format lint --configuration pkgs/by-name/oc/ocr-capture/.swift-format --parallel --strict --recursive pkgs/by-name/oc/ocr-capture/Sources pkgs/by-name/oc/ocr-capture/Tests
  swift-sanitizers:
    name: Swift ${{ matrix.sanitizer }} sanitizer
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          swift test --package-path pkgs/by-name/oc/ocr-capture --sanitize "${{ matrix.sanitizer }}"
  swift-compiler-audits:
    name: Swift compiler audit (${{ matrix.audit }})
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        audit: [strict-memory-safety, legacy-backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Strict memory-safety diagnostics
        if: matrix.audit == 'strict-memory-safety'
        run: >-
          swift test --package-path pkgs/by-name/oc/ocr-capture -Xswiftc -strict-memory-safety
      - name: Legacy Vision backend under Swift 6
        if: matrix.audit == 'legacy-backend'
        run: >-
          swift test --package-path pkgs/by-name/oc/ocr-capture -Xswiftc -D -Xswiftc OCR_CAPTURE_NIX_BUILD
