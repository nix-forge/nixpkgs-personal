name: Scrypted Forge diagnostic
on:
  workflow_dispatch:
permissions: {}
jobs:
  scrypted-forge:
    name: Scrypted Forge literal source pin and installed acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
      - name: Require every security regression and valid control on Forge 1.4.3
        shell: bash
        run: |
          set -euo pipefail
          node=$(nix build --impure --no-link --print-out-paths --file .github/diagnostics/scrypted-forge.nix node)
          candidate=$(nix build --impure --no-link --print-out-paths --file .github/diagnostics/scrypted-forge.nix candidate)
          "$node/bin/node" pkgs/by-name/sc/scrypted-server/scripts/check-forge.mts "$candidate"
      - name: Build complete Scrypted from the real source pin and all installed checks
        run: nix build --impure --no-link -L --file .github/diagnostics/scrypted-forge.nix package
