name: CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for affected package selection.
        required: false
        type: string
      build_expensive_audiomuse:
        description: Build the full AudioMuse AI package and ML dependency closure on x86 Linux.
        default: false
        required: false
        type: boolean
  merge_group:
    types: [checks_requested]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  source-start:
    # Deliver the source notification before validation; status writes are asynchronous.
    name: Source validation start callback
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/automation/package-updates-')
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Notify the protected default-branch reconciler.
    steps:
      - name: Notify source validation start
        uses: nix-forge/ci/actions/queue-completion@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          source-activity: in_progress
  discover:
    needs: [source-start]
    if: "!cancelled()"
    name: Discover CI inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lockfiles: ${{ steps.inventory.outputs.lockfiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: inventory
        uses: nix-forge/ci/actions/discover-lockfiles@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
  lock-health:
    name: Flake lock health
    needs: [flake-lock]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every discovered lockfile to pass
        env:
          LOCK_RESULT: ${{ needs.flake-lock.result }}
        run: test "$LOCK_RESULT" = success
  flake-lock:
    needs: [discover]
    if: "!cancelled() && needs.discover.result == 'success'"
    name: Flake lock (${{ matrix.lockfile }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lockfile: ${{ fromJSON(needs.discover.outputs.lockfiles) }}
    uses: nix-forge/ci/.github/workflows/flake-lock.yml@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
    with:
      lockfile: ${{ matrix.lockfile }}
  lint:
    needs: [source-start]
    if: "!cancelled()"
    name: Lint and security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
          cache-scope: ci-lint
      - name: Check package discovery catalog
        run: python3 scripts/package_catalog.py --check
      - name: Check standalone updater sources
        run: nix develop .#updater --command bash scripts/sync-updater-mirrors.sh
      - name: Check shared workflow contracts
        uses: nix-forge/ci/actions/validate-workflows@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
      - name: Run repository hooks and publication checks
        uses: nix-forge/ci/actions/repository-checks@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
      - name: Build portable lint checks
        uses: nix-forge/ci/actions/flake-checks@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          system: x86_64-linux
          checks-output: lintChecks
  flake:
    needs: [source-start]
    if: "!cancelled()"
    name: Flake checks (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
          cache-scope: ci-flake
      - name: Materialize discovered partitions
        uses: nix-forge/ci/actions/materialize-partitions@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
      - env:
          TARGET_SYSTEM: ${{ matrix.system }}
        run: |
          nix eval --option allow-import-from-derivation false --json ".#checks.$TARGET_SYSTEM" \
            --apply 'builtins.mapAttrs (_: check: check.drvPath)' > /dev/null
          nix flake check --keep-going --show-trace --print-build-logs --no-build --option allow-import-from-derivation false --system "$TARGET_SYSTEM"
  plan-build:
    name: Plan native builds
    needs: [source-start]
    if: "!cancelled()"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      base-sha: ${{ steps.plan.outputs.base-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
          cache-scope: ci-build-plan
      - id: plan
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha
            || github.event.before }}
        run: |
          python3 .github/scripts/partition_packages.py >> "$GITHUB_OUTPUT"
  build:
    name: ${{ matrix.name }}
    needs: [lint, flake, plan-build]
    if: >-
      !cancelled() && needs.lint.result == 'success' && needs.flake.result == 'success' && needs.plan-build.result
      == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-build.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # Stable aggregate jobs below gate every shard. Six shards per system
    # bound cold application batches that exceeded the six-hour hosted limit.
    # Legacy 2/2 names remain stable for branch-protection compatibility.
    # Shard affected packages and run the native check inventory once per system.
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
          cache-scope: ci-build
      - name: Reclaim unused hosted Linux SDK space
        if: runner.os == 'Linux'
        run: |
          df -h /
          # Native dependencies come from Nix, not these preinstalled SDKs.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - name: Build every declared native CI check
        if: matrix.native-checks
        uses: nix-forge/ci/actions/flake-checks@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          system: ${{ matrix.system }}
          checks-output: ciChecks
      - name: Build affected packages
        if: matrix.packages != '[]'
        env:
          BASE_SHA: ${{ needs.plan-build.outputs.base-sha }}
          SYSTEM: ${{ matrix.system }}
          PACKAGES: ${{ matrix.packages }}
        shell: bash
        run: bash .github/scripts/build-affected.sh
  build-complete:
    name: Build (${{ matrix.system }})
    needs: [build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux, aarch64-darwin]
    steps:
      - name: Require every native build shard to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
  expensive-audiomuse-audit:
    needs: [source-start]
    name: Manual AudioMuse AI audit
    if: "!cancelled() && (github.event_name == 'workflow_dispatch' && inputs.build_expensive_audiomuse)"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
          cache-scope: ci-expensive-audiomuse
      - name: Build AudioMuse AI
        run: nix build --print-build-logs .#audiomuse-ai
  queue-completion:
    continue-on-error: ${{ !startsWith(github.ref, 'refs/heads/automation/package-updates-') }}
    name: Queue completion callback
    if: >-
      always() && github.event_name == 'workflow_dispatch' && (startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/',
      github.event.repository.default_branch)) || startsWith(github.ref, 'refs/heads/automation/package-updates-'))
    needs:
      - source-start
      - lock-health
      - discover
      - flake-lock
      - lint
      - flake
      - plan-build
      - build
      - build-complete
      - expensive-audiomuse-audit
      - nur
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          source-activity: ${{ startsWith(github.ref, 'refs/heads/automation/package-updates-') && 'completed'
            || '' }}
  nur:
    needs: [source-start]
    if: "!cancelled()"
    name: NUR compatibility
    permissions:
      contents: read
    uses: nix-forge/ci/.github/workflows/nur.yml@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
