name: PostHog native allocation diagnostic
on:
  workflow_dispatch:
permissions: {}
jobs:
  posthog:
    name: Complete PostHog suite with real fork resource observations
    # The entire finite job uses one standard hosted allocation; observe its
    # actual memory/commit/cgroup limits rather than assuming desktop capacity.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
      - name: Run unchanged complete native suite and observe real forks
        run: nix build --impure --no-link -L --file .github/diagnostics/posthog-resources.nix
