name: CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for affected package selection.
        required: false
        type: string
      build_expensive_font:
        description: Build and exhaustively validate Mutant Standard Emoji on every platform.
        default: false
        required: false
        type: boolean
      build_expensive_audiomuse:
        description: Build the full AudioMuse AI package and ML dependency closure on x86 Linux.
        default: false
        required: false
        type: boolean
  merge_group:
    types: [checks_requested]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  discover:
    name: Discover CI inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lockfiles: ${{ steps.inventory.outputs.lockfiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: inventory
        uses: nix-forge/ci/actions/discover-lockfiles@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
  lock-health:
    name: Flake lock health
    needs: [flake-lock]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every discovered lockfile to pass
        env:
          LOCK_RESULT: ${{ needs.flake-lock.result }}
        run: test "$LOCK_RESULT" = success
  flake-lock:
    needs: [discover]
    name: Flake lock (${{ matrix.lockfile }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lockfile: ${{ fromJSON(needs.discover.outputs.lockfiles) }}
    uses: nix-forge/ci/.github/workflows/flake-lock.yml@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
    with:
      lockfile: ${{ matrix.lockfile }}
  lint:
    name: Lint and security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
        with:
          cache: 'false'
          cache-scope: ci-lint
      - name: Test build selection and source fetch retries
        run: python3 -m unittest discover -s .github/tests
      - name: Test safe release archive inspection
        run: python3 -B -m unittest discover -s pkgs/by-name/re/remindctl -p test_update.py
      - name: Test AudioMuse AI dependency updater
        run: python3 -B -m unittest discover -s pkgs/by-name/au/audiomuse-ai -p 'test_*.py'
      - name: Check package discovery catalog
        run: python3 scripts/package-catalog.py --check
      - name: Check shared workflow contracts
        uses: nix-forge/ci/actions/validate-workflows@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
      - name: Run repository hooks and publication checks
        uses: nix-forge/ci/actions/repository-checks@bb1b39a9082f72dc6c7ce596103ce7a5e4d29b01 # v2.8.0
      - name: Build portable lint checks
        uses: nix-forge/ci/actions/flake-checks@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
        with:
          system: x86_64-linux
          checks-output: lintChecks
  flake:
    name: Flake checks (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
        with:
          cache: 'false'
          cache-scope: ci-flake
      - name: Materialize discovered partitions
        uses: nix-forge/ci/actions/materialize-partitions@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
      - env:
          TARGET_SYSTEM: ${{ matrix.system }}
        run: |
          nix eval --option allow-import-from-derivation false --json ".#checks.$TARGET_SYSTEM" \
            --apply 'builtins.mapAttrs (_: check: check.drvPath)' > /dev/null
          nix flake check --keep-going --show-trace --print-build-logs --no-build --option allow-import-from-derivation false --system "$TARGET_SYSTEM"
  build:
    name: ${{ matrix.name }}
    needs: [lint, flake]
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
            name: Build (x86_64-linux)
            partition-count: 2
            partition-index: 0
          - system: x86_64-linux
            runner: ubuntu-24.04
            name: Build (x86_64-linux 2/2)
            partition-count: 2
            partition-index: 1
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            name: Build (aarch64-linux)
            partition-count: 2
            partition-index: 0
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            name: Build (aarch64-linux 2/2)
            partition-count: 2
            partition-index: 1
          - system: aarch64-darwin
            runner: macos-26
            name: Build (aarch64-darwin)
            partition-count: 1
            partition-index: 0
    runs-on: ${{ matrix.runner }}
    # A single uncached Node.js dependency can exceed two hours on hosted runners.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
        with:
          cache: 'false'
          cache-scope: ci-build
      - name: Build every declared native CI check
        uses: nix-forge/ci/actions/flake-checks@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
        with:
          system: ${{ matrix.system }}
          checks-output: ciChecks
          partition-count: ${{ matrix.partition-count }}
          partition-index: ${{ matrix.partition-index }}
          weights-file: .github/ci-check-weights.json
      - name: Build affected packages
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha
            || github.event.before }}
          SYSTEM: ${{ matrix.system }}
          PARTITION_COUNT: ${{ matrix.partition-count }}
          PARTITION_INDEX: ${{ matrix.partition-index }}
        shell: bash
        run: bash .github/scripts/build-affected.sh
  expensive-font-audit:
    name: Manual expensive font audit (${{ matrix.system }})
    if: github.event_name == 'workflow_dispatch' && inputs.build_expensive_font
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
        with:
          cache: 'false'
          cache-scope: ci-expensive-font
      - name: Build exhaustive font audit
        uses: nix-forge/ci/actions/flake-checks@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
        with:
          system: ${{ matrix.system }}
          checks-output: manualChecks
  expensive-audiomuse-audit:
    name: Manual AudioMuse AI audit
    if: github.event_name == 'workflow_dispatch' && inputs.build_expensive_audiomuse
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
        with:
          cache: 'false'
          cache-scope: ci-expensive-audiomuse
      - name: Build AudioMuse AI
        run: nix build --print-build-logs .#audiomuse-ai
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/',
      github.event.repository.default_branch))
    needs:
      - lock-health
      - discover
      - flake-lock
      - lint
      - flake
      - build
      - expensive-font-audit
      - expensive-audiomuse-audit
      - nur
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
  nur:
    name: NUR compatibility
    permissions:
      contents: read
    uses: nix-forge/ci/.github/workflows/nur.yml@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
