name: Retained package qualification
on:
  workflow_dispatch:
    inputs:
      scope:
        description: All native probes or only the repaired tooling.
        type: choice
        default: all
        options: [all, tools, vorssaint, metadata]
      source_ref:
        description: Immutable source commit required for the metadata scope.
        type: string
        required: false
permissions: {}
concurrency:
  group: retained-package-${{ github.ref }}-${{ inputs.scope }}
  cancel-in-progress: false
jobs:
  tools:
    if: inputs.scope == 'all' || inputs.scope == 'tools'
    name: Tooling, catalog and Blueair dependency hash
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
      - name: Freeze source and calculate the actual dependency hash
        run: |
          mkdir receipt
          git rev-parse HEAD > receipt/source.txt
          nix run --inputs-from . nixpkgs#prefetch-npm-deps -- \
            pkgs/by-name/ho/homebridge-blueair-purifier/package-lock.json > receipt/blueair-npm-hash.txt
      - name: Run repository hooks with the upstream tooling backports
        if: ${{ !cancelled() }}
        run: nix develop --command prek run --all-files --show-diff-on-failure
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: retained-tooling-receipt
          path: receipt
  vorssaint:
    if: inputs.scope == 'all' || inputs.scope == 'vorssaint'
    name: Vorssaint native Swift and C target qualification
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
      - name: Build application, helpers and existing native install checks
        run: nix build --no-link -L .#vorssaint
  wardrowbe:
    if: inputs.scope == 'all'
    name: Wardrowbe deterministic search (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
      - name: Run all original owning UI regressions under the real package build
        run: nix build --no-link -L .#wardrowbe-frontend
  metadata:
    if: inputs.scope == 'metadata'
    name: Generate authoritative locked package catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require an immutable metadata source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: '[[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
      - name: Render the catalog from actual public output metadata
        run: |
          mkdir receipt
          git rev-parse HEAD > receipt/source.txt
          python3 scripts/package_catalog.py
          cp docs/catalog.md receipt/catalog.md
          git diff -- docs/catalog.md > receipt/catalog.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: locked-package-catalog
          path: receipt
