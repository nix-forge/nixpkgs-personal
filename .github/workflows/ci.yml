name: CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for affected package selection.
        required: false
        type: string
  merge_group:
    types: [checks_requested]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  flake-lock:
    name: Flake lock (${{ matrix.lockfile }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lockfile: [flake.lock, flake/dev/flake.lock]
    uses: nix-forge/ci/.github/workflows/flake-lock.yml@03eb849e788bd71ac08afab6a1135a6ff6514f3c # v1.0.4
    with:
      lockfile: ${{ matrix.lockfile }}
  lint:
    name: Lint and security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@03eb849e788bd71ac08afab6a1135a6ff6514f3c # v1.0.4
        with:
          cache: 'false'
          cache-scope: ci-lint
      - name: Test build selection and source fetch retries
        run: python3 -m unittest discover -s .github/tests
      - name: Test safe release archive inspection
        run: python3 -B -m unittest discover -s pkgs/by-name/re/remindctl -p test_update.py
      - name: Materialize partition source
        run: nix store add-path flake/dev
      - run: nix develop --command prek run --all-files
      - run: nix develop --command gitleaks detect --source . --redact --config=.gitleaks.toml
  flake:
    name: Flake checks (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@03eb849e788bd71ac08afab6a1135a6ff6514f3c # v1.0.4
        with:
          cache: 'false'
          cache-scope: ci-flake
      - name: Materialize partition source
        run: nix store add-path flake/dev
      - run: nix flake check --keep-going --show-trace --print-build-logs --no-build --option allow-import-from-derivation
          false --system "${TARGET_SYSTEM}"
        env:
          TARGET_SYSTEM: ${{ matrix.system }}
  build:
    name: Build (${{ matrix.system }})
    needs: [lint, flake]
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    # Full cold builds include font compilation and a multi-gigabyte ISO fetch.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@03eb849e788bd71ac08afab6a1135a6ff6514f3c # v1.0.4
        with:
          cache: 'false'
          cache-scope: ci-build
      - name: Check font import and update contracts
        env:
          SYSTEM: ${{ matrix.system }}
        run: nix build --no-link --print-build-logs ".#checks.$SYSTEM.apple-font-tooling"
      - name: Build affected packages
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha
            || github.event.before }}
          SYSTEM: ${{ matrix.system }}
        shell: bash
        run: bash .github/scripts/build-affected.sh
  swift-quality:
    name: Swift quality (macOS 26)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@03eb849e788bd71ac08afab6a1135a6ff6514f3c # v1.0.4
        with:
          cache: 'false'
          cache-scope: ci-swift-quality
      - name: Materialize partition source
        run: nix store add-path flake/dev
      - name: Compiler, lint, test, and dead-code checks
        env:
          OCR_CAPTURE_RUN_SANITIZERS: "0"
        run: nix develop .#swift-quality --command pkgs/by-name/oc/ocr-capture/Scripts/check-quality.sh
      - name: Xcode Swift 6 formatter compatibility
        run: >-
          xcrun swift-format lint --configuration pkgs/by-name/oc/ocr-capture/.swift-format --parallel
          --strict --recursive pkgs/by-name/oc/ocr-capture/Sources pkgs/by-name/oc/ocr-capture/Tests
  swift-sanitizers:
    name: Swift ${{ matrix.sanitizer }} sanitizer
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          swift test --package-path pkgs/by-name/oc/ocr-capture --sanitize "${SANITIZER}"
        env:
          SANITIZER: ${{ matrix.sanitizer }}
  swift-compiler-audits:
    name: Swift compiler audit (${{ matrix.audit }})
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        audit: [strict-memory-safety, legacy-backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Strict memory-safety diagnostics
        if: matrix.audit == 'strict-memory-safety'
        run: >-
          swift test --package-path pkgs/by-name/oc/ocr-capture -Xswiftc -strict-memory-safety
      - name: Legacy Vision backend under Swift 6
        if: matrix.audit == 'legacy-backend'
        run: >-
          swift test --package-path pkgs/by-name/oc/ocr-capture -Xswiftc -D -Xswiftc OCR_CAPTURE_NIX_BUILD
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')
    needs: [flake-lock, lint, flake, build, swift-quality, swift-sanitizers, swift-compiler-audits, nur]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@03eb849e788bd71ac08afab6a1135a6ff6514f3c # v1.0.4
  nur:
    name: NUR compatibility
    permissions:
      contents: read
    uses: nix-forge/ci/.github/workflows/nur.yml@03eb849e788bd71ac08afab6a1135a6ff6514f3c # v1.0.4
