name: Photocraft spool diagnostic
on:
  workflow_dispatch:
permissions: {}
jobs:
  photocraft-spool:
    name: Photocraft ARM isolated PDF spool transport
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
      - name: Run original PDF transport regression in the Nix sandbox
        run: nix build --impure --no-link -L --file .github/diagnostics/photocraft-spool.nix
