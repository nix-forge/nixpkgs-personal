name: CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for affected package selection.
        required: false
        type: string
      build_expensive_font:
        description: Build and exhaustively validate Mutant Standard Emoji on every platform.
        default: false
        required: false
        type: boolean
      build_expensive_audiomuse:
        description: Build the full AudioMuse AI package and ML dependency closure on x86 Linux.
        default: false
        required: false
        type: boolean
  merge_group:
    types: [checks_requested]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  source-start:
    # Deliver the source notification before validation; status writes are asynchronous.
    name: Source validation start callback
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/automation/package-updates-')
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Notify the protected default-branch reconciler.
    steps:
      - name: Notify source validation start
        uses: nix-forge/ci/actions/queue-completion@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          source-activity: in_progress
  discover:
    needs: [source-start]
    if: "!cancelled()"
    name: Discover CI inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lockfiles: ${{ steps.inventory.outputs.lockfiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: inventory
        uses: nix-forge/ci/actions/discover-lockfiles@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
  lock-health:
    name: Flake lock health
    needs: [flake-lock]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every discovered lockfile to pass
        env:
          LOCK_RESULT: ${{ needs.flake-lock.result }}
        run: test "$LOCK_RESULT" = success
  flake-lock:
    needs: [discover]
    if: "!cancelled() && needs.discover.result == 'success'"
    name: Flake lock (${{ matrix.lockfile }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lockfile: ${{ fromJSON(needs.discover.outputs.lockfiles) }}
    uses: nix-forge/ci/.github/workflows/flake-lock.yml@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
    with:
      lockfile: ${{ matrix.lockfile }}
  lint:
    needs: [source-start]
    if: "!cancelled()"
    name: Lint and security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
          cache-scope: ci-lint
      - name: Test package automation publication
        run: |
          test -f tests/test_update_packages.py
          python3 -B -m unittest discover -s tests -p test_update_packages.py -v
      - name: Test build selection and source fetch retries
        run: python3 -m unittest discover -s .github/tests
      - name: Test safe release archive inspection
        run: python3 -B -m unittest discover -s pkgs/by-name/re/remindctl -p test_update.py
      - name: Test AudioMuse AI dependency updater
        run: python3 -B -m unittest discover -s pkgs/by-name/au/audiomuse-ai -p 'test_*.py'
      - name: Check package discovery catalog
        run: python3 scripts/package-catalog.py --check
      - name: Check shared workflow contracts
        uses: nix-forge/ci/actions/validate-workflows@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
      - name: Run repository hooks and publication checks
        uses: nix-forge/ci/actions/repository-checks@13ad6e366ec01e317705d750fc512d33ecc15f6c # v2.9.0
      - name: Build portable lint checks
        uses: nix-forge/ci/actions/flake-checks@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          system: x86_64-linux
          checks-output: lintChecks
  flake:
    needs: [source-start]
    if: "!cancelled()"
    name: Flake checks (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
          cache-scope: ci-flake
      - name: Materialize discovered partitions
        uses: nix-forge/ci/actions/materialize-partitions@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
      - env:
          TARGET_SYSTEM: ${{ matrix.system }}
        run: |
          nix eval --option allow-import-from-derivation false --json ".#checks.$TARGET_SYSTEM" \
            --apply 'builtins.mapAttrs (_: check: check.drvPath)' > /dev/null
          nix flake check --keep-going --show-trace --print-build-logs --no-build --option allow-import-from-derivation false --system "$TARGET_SYSTEM"
  build:
    name: ${{ matrix.name }}
    needs: [lint, flake]
    if: "!cancelled() && needs.lint.result == 'success' && needs.flake.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
            name: Build (x86_64-linux)
            partition-count: 2
            partition-index: 0
          - system: x86_64-linux
            runner: ubuntu-24.04
            name: Build (x86_64-linux 2/2)
            partition-count: 2
            partition-index: 1
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            name: Build (aarch64-linux)
            partition-count: 2
            partition-index: 0
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            name: Build (aarch64-linux 2/2)
            partition-count: 2
            partition-index: 1
          - system: aarch64-darwin
            runner: macos-26
            name: Build (aarch64-darwin)
            partition-count: 1
            partition-index: 0
    runs-on: ${{ matrix.runner }}
    # A single uncached Node.js dependency can exceed two hours on hosted runners.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
          cache-scope: ci-build
      - name: Build every declared native CI check
        uses: nix-forge/ci/actions/flake-checks@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          system: ${{ matrix.system }}
          checks-output: ciChecks
          partition-count: ${{ matrix.partition-count }}
          partition-index: ${{ matrix.partition-index }}
          weights-file: .github/ci-check-weights.json
      - name: Build affected packages
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha
            || github.event.before }}
          SYSTEM: ${{ matrix.system }}
          PARTITION_COUNT: ${{ matrix.partition-count }}
          PARTITION_INDEX: ${{ matrix.partition-index }}
        shell: bash
        run: bash .github/scripts/build-affected.sh
      - name: Verify Codex bundle with Apple's signature verifier
        if: matrix.system == 'aarch64-darwin'
        shell: bash
        run: |
          set -euo pipefail
          package=$(nix eval --raw --no-write-lock-file .#packages.aarch64-darwin.openai-codex-desktop.outPath)
          app_name=$(nix eval --raw --no-write-lock-file .#packages.aarch64-darwin.openai-codex-desktop.appName)
          if [[ ! -d "$package" ]]; then
            nix build --no-link --no-write-lock-file .#packages.aarch64-darwin.openai-codex-desktop
          fi
          bundle="$package/Applications/$app_name.app"
          test -d "$bundle"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$bundle"
  expensive-font-audit:
    needs: [source-start]
    name: Manual expensive font audit (${{ matrix.system }})
    if: "!cancelled() && (github.event_name == 'workflow_dispatch' && inputs.build_expensive_font)"
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
          cache-scope: ci-expensive-font
      - name: Build exhaustive font audit
        uses: nix-forge/ci/actions/flake-checks@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          system: ${{ matrix.system }}
          checks-output: manualChecks
  expensive-audiomuse-audit:
    needs: [source-start]
    name: Manual AudioMuse AI audit
    if: "!cancelled() && (github.event_name == 'workflow_dispatch' && inputs.build_expensive_audiomuse)"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
          cache-scope: ci-expensive-audiomuse
      - name: Build AudioMuse AI
        run: nix build --print-build-logs .#audiomuse-ai
  queue-completion:
    continue-on-error: ${{ !startsWith(github.ref, 'refs/heads/automation/package-updates-') }}
    name: Queue completion callback
    if: >-
      always() && github.event_name == 'workflow_dispatch' && (startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/',
      github.event.repository.default_branch)) || startsWith(github.ref, 'refs/heads/automation/package-updates-'))
    needs:
      - source-start
      - lock-health
      - discover
      - flake-lock
      - lint
      - flake
      - build
      - expensive-font-audit
      - expensive-audiomuse-audit
      - nur
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          source-activity: ${{ startsWith(github.ref, 'refs/heads/automation/package-updates-') && 'completed'
            || '' }}
  nur:
    needs: [source-start]
    if: "!cancelled()"
    name: NUR compatibility
    permissions:
      contents: read
    uses: nix-forge/ci/.github/workflows/nur.yml@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
