name: CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for affected package selection.
        required: false
        type: string
  merge_group:
    types: [checks_requested]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  discover:
    name: Discover CI inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lockfiles: ${{ steps.inventory.outputs.lockfiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: inventory
        uses: nix-forge/ci/actions/discover-lockfiles@78ee44eba73081183f51c85194c6dd9382feb60f # v2.5.0
  lock-health:
    name: Flake lock health
    needs: [flake-lock]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every discovered lockfile to pass
        env:
          LOCK_RESULT: ${{ needs.flake-lock.result }}
        run: test "$LOCK_RESULT" = success
  flake-lock:
    needs: [discover]
    name: Flake lock (${{ matrix.lockfile }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lockfile: ${{ fromJSON(needs.discover.outputs.lockfiles) }}
    uses: nix-forge/ci/.github/workflows/flake-lock.yml@78ee44eba73081183f51c85194c6dd9382feb60f # v2.5.0
    with:
      lockfile: ${{ matrix.lockfile }}
  lint:
    name: Lint and security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@78ee44eba73081183f51c85194c6dd9382feb60f # v2.5.0
        with:
          cache: 'false'
          cache-scope: ci-lint
      - name: Test build selection and source fetch retries
        run: python3 -m unittest discover -s .github/tests
      - name: Test safe release archive inspection
        run: python3 -B -m unittest discover -s pkgs/by-name/re/remindctl -p test_update.py
      - name: Check package discovery catalog
        run: python3 scripts/package-catalog.py --check
      - name: Check shared workflow contracts
        uses: nix-forge/ci/actions/validate-workflows@78ee44eba73081183f51c85194c6dd9382feb60f # v2.5.0
      - name: Run repository hooks and publication checks
        uses: nix-forge/ci/actions/repository-checks@78ee44eba73081183f51c85194c6dd9382feb60f # v2.5.0
      - name: Build portable lint checks
        uses: nix-forge/ci/actions/flake-checks@78ee44eba73081183f51c85194c6dd9382feb60f # v2.5.0
        with:
          system: x86_64-linux
          checks-output: lintChecks
  flake:
    name: Flake checks (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@78ee44eba73081183f51c85194c6dd9382feb60f # v2.5.0
        with:
          cache: 'false'
          cache-scope: ci-flake
      - name: Materialize discovered partitions
        uses: nix-forge/ci/actions/materialize-partitions@78ee44eba73081183f51c85194c6dd9382feb60f # v2.5.0
      - env:
          TARGET_SYSTEM: ${{ matrix.system }}
        run: |
          nix eval --option allow-import-from-derivation false --json ".#checks.$TARGET_SYSTEM" \
            --apply 'builtins.mapAttrs (_: check: check.drvPath)' > /dev/null
          nix flake check --keep-going --show-trace --print-build-logs --no-build --option allow-import-from-derivation false --system "$TARGET_SYSTEM"
      - name: Build every declared native CI check
        uses: nix-forge/ci/actions/flake-checks@78ee44eba73081183f51c85194c6dd9382feb60f # v2.5.0
        with:
          system: ${{ matrix.system }}
          checks-output: ciChecks
      - name: Build affected packages
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha
            || github.event.before }}
          SYSTEM: ${{ matrix.system }}
        shell: bash
        run: bash .github/scripts/build-affected.sh
  build:
    name: Build (${{ matrix.system }})
    needs: [flake]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux, aarch64-darwin]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report native build result
        env:
          NATIVE_RESULT: ${{ needs.flake.result }}
        run: test "$NATIVE_RESULT" = success
  swift-validation:
    name: Swift validation (${{ matrix.package }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: oc/ocr-capture
            shell: swift-quality
          - package: fi/finder-favorites
            shell: finder-favorites-quality
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@78ee44eba73081183f51c85194c6dd9382feb60f # v2.5.0
        with:
          cache: 'false'
          cache-scope: ci-swift-quality
      - name: Materialize discovered partitions
        uses: nix-forge/ci/actions/materialize-partitions@78ee44eba73081183f51c85194c6dd9382feb60f # v2.5.0
      - name: Compiler, lint, test, and dead-code checks
        env:
          OCR_CAPTURE_RUN_SANITIZERS: "0"
          FINDER_FAVORITES_RUN_SANITIZERS: "0"
          PACKAGE: ${{ matrix.package }}
          QUALITY_SHELL: ${{ matrix.shell }}
        run: nix develop ".#$QUALITY_SHELL" --command "pkgs/by-name/$PACKAGE/Scripts/check-quality.sh"
      - name: Xcode Swift 6 formatter compatibility
        env:
          PACKAGE: ${{ matrix.package }}
        run: >-
          xcrun swift-format lint --configuration "pkgs/by-name/$PACKAGE/.swift-format" --parallel --strict
          --recursive "pkgs/by-name/$PACKAGE/Sources" "pkgs/by-name/$PACKAGE/Tests"
      - name: Address sanitizer
        env:
          PACKAGE: ${{ matrix.package }}
        run: swift test --package-path "pkgs/by-name/$PACKAGE" --sanitize address
      - name: Thread sanitizer
        env:
          PACKAGE: ${{ matrix.package }}
        run: swift test --package-path "pkgs/by-name/$PACKAGE" --sanitize thread
      - name: Strict memory-safety diagnostics
        if: matrix.package == 'oc/ocr-capture'
        run: >-
          swift test --package-path pkgs/by-name/oc/ocr-capture -Xswiftc -strict-memory-safety
      - name: Legacy Vision backend under Swift 6
        if: matrix.package == 'oc/ocr-capture'
        run: >-
          swift test --package-path pkgs/by-name/oc/ocr-capture -Xswiftc -D -Xswiftc OCR_CAPTURE_NIX_BUILD
  swift-quality:
    name: Swift quality (${{ matrix.package }})
    needs: [swift-validation]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        package: [oc/ocr-capture, fi/finder-favorites]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report Swift validation result
        env:
          SWIFT_RESULT: ${{ needs.swift-validation.result }}
        run: test "$SWIFT_RESULT" = success
  swift-sanitizers:
    name: Swift ${{ matrix.sanitizer }} sanitizer (${{ matrix.package }})
    needs: [swift-validation]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
        package: [oc/ocr-capture, fi/finder-favorites]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report Swift validation result
        env:
          SWIFT_RESULT: ${{ needs.swift-validation.result }}
        run: test "$SWIFT_RESULT" = success
  swift-compiler-audits:
    name: Swift compiler audit (${{ matrix.audit }})
    needs: [swift-validation]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        audit: [strict-memory-safety, legacy-backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report Swift validation result
        env:
          SWIFT_RESULT: ${{ needs.swift-validation.result }}
        run: test "$SWIFT_RESULT" = success
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/',
      github.event.repository.default_branch))
    needs:
      - lock-health
      - discover
      - flake-lock
      - lint
      - flake
      - build
      - swift-validation
      - swift-quality
      - swift-sanitizers
      - swift-compiler-audits
      - nur
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@78ee44eba73081183f51c85194c6dd9382feb60f # v2.5.0
  nur:
    name: NUR compatibility
    permissions:
      contents: read
    uses: nix-forge/ci/.github/workflows/nur.yml@78ee44eba73081183f51c85194c6dd9382feb60f # v2.5.0
