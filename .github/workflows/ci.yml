name: Upstream retirement qualification
on:
  workflow_dispatch:
permissions: {}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55
        with:
          cache: 'false'
      - name: Freeze the immutable upstream package set
        run: |
          mkdir -p receipt
          nix flake metadata --json --no-write-lock-file github:NixOS/nixpkgs/b3cff76391a4867236cc135b69a928d873b9f6d0 > receipt/nixpkgs-apps.json
      - name: Verify reduced personal collection and real build selection
        run: |
          nix develop --command python3 -B -m unittest discover -s .github/tests
          nix develop --command python3 scripts/package_catalog.py --check
          nix develop --command prek run --all-files
      - name: Save formatting evidence
        if: always()
        run: git diff --binary > receipt/formatting.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: upstream-retirement-receipt
          path: receipt
