name: DesignCraft native print diagnostic
on:
  workflow_dispatch:
permissions: {}
jobs:
  designcraft-print:
    name: DesignCraft Darwin print clock boundary and full engine suite
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: nix-forge/ci/actions/setup-nix@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
        with:
          cache: 'false'
      - name: Prove original failure, delayed repair and clean owning engine suite
        run: nix build --impure --no-link -L --file .github/diagnostics/designcraft-print.nix
