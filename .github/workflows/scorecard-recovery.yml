name: Recover Scorecard API outages
on: # zizmor: ignore[dangerous-triggers] Validates API metadata; never checks out caller code.
  workflow_run:
    workflows: ["OpenSSF Scorecard"]
    types: [completed]
permissions: {}
concurrency:
  group: scorecard-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  recover:
    if: github.event.workflow_run.conclusion == 'failure'
    permissions:
      actions: write # Retry only verified current-branch outages, with a bounded attempt count.
      contents: read
    uses: nix-forge/ci/.github/workflows/retry-scorecard.yml@1a6dfe0b851c69ad30169977e014bd45029e9c55 # v2.13.0
    with:
      source-run-id: ${{ format('{0}', github.event.workflow_run.id) }}
