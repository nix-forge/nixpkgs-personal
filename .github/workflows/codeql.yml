name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:
permissions: {}
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  analyze-python:
    name: Analyze (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    permissions:
      contents: read
      security-events: write # Upload code scanning results.
    uses: nix-forge/ci/.github/workflows/codeql.yml@03eb849e788bd71ac08afab6a1135a6ff6514f3c # v1.0.4
    with:
      languages: ${{ matrix.language }}
  analyze:
    name: analyze
    needs: [analyze-python, analyze-swift]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CodeQL language to pass
        env:
          PYTHON_RESULT: ${{ needs.analyze-python.result }}
          SWIFT_RESULT: ${{ needs.analyze-swift.result }}
        run: test "$PYTHON_RESULT" = success && test "$SWIFT_RESULT" = success
  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Upload code scanning results.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          build-mode: manual
          languages: swift
      - name: Build OCR Capture
        run: >-
          swift build --package-path pkgs/by-name/oc/ocr-capture --arch arm64 -Xswiftc -warnings-as-errors
      - name: Build Finder Favorites
        run: >-
          swift build --package-path pkgs/by-name/fi/finder-favorites --arch arm64 -Xswiftc -warnings-as-errors
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')
    needs: [analyze-python, analyze, analyze-swift]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@03eb849e788bd71ac08afab6a1135a6ff6514f3c # v1.0.4
