name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:
permissions: {}
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze-actions:
    name: Analyze (actions)
    permissions:
      actions: read # Read workflow metadata for Actions analysis.
      contents: read
      security-events: write # Upload code scanning results.
    uses: nix-forge/ci/.github/workflows/codeql.yml@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
    with:
      languages: actions
  analyze-python:
    name: Analyze (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    permissions:
      contents: read
      security-events: write # Upload code scanning results.
    uses: nix-forge/ci/.github/workflows/codeql.yml@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
    with:
      languages: ${{ matrix.language }}
  analyze:
    name: analyze
    needs: [analyze-actions, analyze-python]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CodeQL language to pass
        env:
          ACTIONS_RESULT: ${{ needs.analyze-actions.result }}
          PYTHON_RESULT: ${{ needs.analyze-python.result }}
        run: >-
          test "$ACTIONS_RESULT" = success && test "$PYTHON_RESULT" = success
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/',
      github.event.repository.default_branch))
    needs: [analyze-actions, analyze-python, analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
