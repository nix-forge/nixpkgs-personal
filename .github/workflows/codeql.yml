name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:
permissions: {}
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-start:
    # Deliver the source notification before validation; status writes are asynchronous.
    name: Source validation start callback
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/automation/package-updates-')
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Notify the protected default-branch reconciler.
    steps:
      - name: Notify source validation start
        uses: nix-forge/ci/actions/queue-completion@ab8e486d3d1c48edd116578e097a46eb0c8f5097 # v2.12.0
        with:
          source-activity: in_progress
  analyze-actions:
    needs: [source-start]
    if: "!cancelled()"
    name: Analyze (actions)
    permissions:
      actions: read # Read workflow metadata for Actions analysis.
      contents: read
      security-events: write # Upload code scanning results.
    uses: nix-forge/ci/.github/workflows/codeql.yml@1e0a32faa469994e478ba8a3944875b6aca7e659 # v2.11.0
    with:
      languages: actions
  analyze-python:
    needs: [source-start]
    if: "!cancelled()"
    name: Analyze (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    permissions:
      contents: read
      security-events: write # Upload code scanning results.
    uses: nix-forge/ci/.github/workflows/codeql.yml@1e0a32faa469994e478ba8a3944875b6aca7e659 # v2.11.0
    with:
      languages: ${{ matrix.language }}
  analyze:
    name: analyze
    needs: [analyze-actions, analyze-python]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CodeQL language to pass
        env:
          ACTIONS_RESULT: ${{ needs.analyze-actions.result }}
          PYTHON_RESULT: ${{ needs.analyze-python.result }}
        run: >-
          test "$ACTIONS_RESULT" = success && test "$PYTHON_RESULT" = success
  queue-completion:
    continue-on-error: ${{ !startsWith(github.ref, 'refs/heads/automation/package-updates-') }}
    name: Queue completion callback
    if: >-
      always() && github.event_name == 'workflow_dispatch' && (startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/',
      github.event.repository.default_branch)) || startsWith(github.ref, 'refs/heads/automation/package-updates-'))
    needs: [source-start, analyze-actions, analyze-python, analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@ab8e486d3d1c48edd116578e097a46eb0c8f5097 # v2.12.0
        with:
          source-activity: ${{ startsWith(github.ref, 'refs/heads/automation/package-updates-') && 'completed'
            || '' }}
