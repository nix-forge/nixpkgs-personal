name: Reconcile merge queue
on: # zizmor: ignore[dangerous-triggers] Reads API metadata and runs only the default branch's script.
  workflow_run:
    workflows: ["CI", "Dependency review", "CodeQL", "DCO", "Fuzz font path validation", "NUR compatibility"]
    types: [completed]
  schedule:
    - cron: 17 * * * *
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Queue validation run whose completion triggered reconciliation.
        type: string
        required: false
permissions: {}
concurrency:
  group: reconcile-merge-queue
  cancel-in-progress: false
jobs:
  reconcile:
    # Dispatch completions can make an auto-merge PR or queue ref ready.
    if: >-
      github.event_name != 'workflow_run' || contains(fromJSON('["pull_request", "merge_group", "workflow_dispatch"]'),
      github.event.workflow_run.event)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read # Read validation evidence for the queued commit.
      actions: write # Dispatch trusted queue validation.
      contents: write # Update trusted repository automation.
      pull-requests: write # Update pull request metadata.
      statuses: write # Report verified queue job results.
    steps:
      - name: Reconcile verified automation
        uses: nix-forge/ci/actions/reconcile-queue@13ad6e366ec01e317705d750fc512d33ecc15f6c # v2.9.0
        with:
          workflows: '["ci.yml", "dependency-review.yml", "codeql.yml", "dco.yml", "fuzz.yml", "nur.yml"]'
          base-sha-workflows: '["ci.yml", "dco.yml"]'
          source-run-id: ${{ inputs.source_run_id }}
    name: reconcile
