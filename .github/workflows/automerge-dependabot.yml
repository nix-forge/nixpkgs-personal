name: Auto-merge Dependabot
on: # zizmor: ignore[dangerous-triggers] This workflow neither checks out nor executes PR code.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
permissions: {}
concurrency:
  group: dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  enable:
    name: enable
    permissions:
      contents: write # Update trusted repository automation.
      pull-requests: write # Update pull request metadata.
    uses: nix-forge/ci/.github/workflows/automerge.yml@03eb849e788bd71ac08afab6a1135a6ff6514f3c # v1.0.4
