name: Fuzz font path validation
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '13 9 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  font-path:
    name: Fuzz font path validation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nix-forge/ci/actions/fuzz-atheris@13ad6e366ec01e317705d750fc512d33ecc15f6c # v2.8.0-compatible fuzz action
        with:
          target: fuzz/font_path_fuzzer.py
          python-version: '3.14'
