name: Fuzz font path validation
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '13 9 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-start:
    # Deliver the source notification before validation; status writes are asynchronous.
    name: Source validation start callback
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/automation/package-updates-')
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Notify the protected default-branch reconciler.
    steps:
      - name: Notify source validation start
        uses: nix-forge/ci/actions/queue-completion@ab8e486d3d1c48edd116578e097a46eb0c8f5097 # v2.12.0
        with:
          source-activity: in_progress
  font-path:
    needs: [source-start]
    if: "!cancelled()"
    name: Fuzz font path validation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nix-forge/ci/actions/fuzz-atheris@1e0a32faa469994e478ba8a3944875b6aca7e659 # v2.11.0-compatible fuzz action
        with:
          target: fuzz/font_path_fuzzer.py
          python-version: '3.14'
  queue-completion:
    continue-on-error: ${{ !startsWith(github.ref, 'refs/heads/automation/package-updates-') }}
    name: Queue completion callback
    if: >-
      always() && github.event_name == 'workflow_dispatch' && (startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/',
      github.event.repository.default_branch)) || startsWith(github.ref, 'refs/heads/automation/package-updates-'))
    needs: [source-start, font-path]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@ab8e486d3d1c48edd116578e097a46eb0c8f5097 # v2.12.0
        with:
          source-activity: ${{ startsWith(github.ref, 'refs/heads/automation/package-updates-') && 'completed'
            || '' }}
