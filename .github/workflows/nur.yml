name: NUR compatibility
on:
  schedule:
    - cron: 41 6 * * 1
  workflow_dispatch:
permissions: {}
jobs:
  nur:
    name: NUR compatibility
    permissions:
      contents: read
    uses: nix-forge/ci/.github/workflows/nur.yml@03eb849e788bd71ac08afab6a1135a6ff6514f3c # v1.0.4
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
