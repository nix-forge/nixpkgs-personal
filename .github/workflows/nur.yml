name: NUR compatibility
on:
  schedule:
    - cron: 41 6 * * 1
  workflow_dispatch:
permissions: {}
jobs:
  nur:
    name: NUR compatibility
    permissions:
      contents: read
    uses: nix-forge/ci/.github/workflows/nur.yml@4ab5625bc19dccae2adc7e1dcfb0c5d3661892f4 # v2.14.0
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
