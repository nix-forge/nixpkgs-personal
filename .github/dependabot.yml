version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 2
    rebase-strategy: auto
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      shared-ci:
        patterns: ["nix-forge/ci"]
        group-by: dependency-name
      github-actions-minor-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
  - package-ecosystem: nix
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1
    rebase-strategy: auto
    labels: ["dependencies", "nix"]
    commit-message:
      prefix: "build"
      include: scope
    groups:
      nix-inputs-minor-patch:
        patterns: ["*"]
